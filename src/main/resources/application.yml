spring:
  datasource:
    url: jdbc:mysql://localhost:13306/labs?rewriteBatchedStatements=${labs.rewrite-batched:true}&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root
    hikari:
      maximum-pool-size: 10
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          batch_size: ${labs.hibernate-batch-size:0}
        order_updates: true
  data:
    redis:
      host: localhost
      port: 16379
  main:
    banner-mode: off

logging:
  level:
    root: warn
    com.dingco.labs: info
